global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'service-a'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service-a:8081']

  - job_name: 'service-b'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service-b:8082']

  - job_name: 'service-c'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['service-c:8083']

  - job_name: 'monitor-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['monitor-service:8085']