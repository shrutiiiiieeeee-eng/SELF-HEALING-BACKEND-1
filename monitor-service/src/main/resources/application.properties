spring.application.name=monitor-service
server.port=8085

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always

# H2 in-memory DB for healing logs
spring.datasource.url=jdbc:h2:mem:healingdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Monitored services (Docker DNS names and local hostnames supported)
monitored.services=http://service-a:8081,http://service-b:8082,http://service-c:8083

# Docker configuration
docker.host=${DOCKER_HOST:unix:///var/run/docker.sock}
docker.enabled=true

